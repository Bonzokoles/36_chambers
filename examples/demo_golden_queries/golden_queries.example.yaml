    scenario: devz_knowledge
    query: "How to configure the LLM provider in the agent framework?"
    intent_expected: technical_knowledge
    routes_expected:
      required: [3]
      allowed: [1, 5]
      forbidden: [4, 8]
    retrieval:
      required_evidence_ids: []
      required_terms: ["provider", "api"]
      top_k: 5
    answer:
      must_include: ["provider", "api"]
      must_not_claim: []
      citations_required: true
    safety:
      read_only: true
      expected_action: answer
    latency_budget_ms: 5000
    reviewer_notes: "Semantic retrieval test case"

